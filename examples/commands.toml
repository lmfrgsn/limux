# Copy to ~/.config/limux/commands.toml and chmod 600.
# Names are searchable; Enter copies the value. No automatic expansion.
[snippets]
";email" = "person@example.invalid"
";address" = "123 Example Street, Example City"
";phone" = "+1 555 0100"
";signature" = "Example Person\nExample City"
";lorem" = "Lorem ipsum dolor sit amet."

# Optional personal destinations. Use HTTPS URLs or absolute local paths.
[quicklinks]
"Example website" = "https://example.org"
"Example folder" = "/home/yourname/Documents"
