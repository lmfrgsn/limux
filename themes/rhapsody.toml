name = "Rhapsody"

[colors]
# Six original foundation colours. Accent is neutral emphasis, not selection.
canvas = "#DADAE3"
surface = "#F8F8FA"
chrome = "#EAE9F0"
accent = "#77768F"
text = "#343442"
dark_terminal = "#2F303B"
# Approved initial Mangobar baseline; not necessarily the final design.
metal = "#A8A8B4"
text_secondary = "#666573"
text_quiet = "#686773"
signal_yellow = "#E3BE47"
signal_green = "#728858"
signal_red = "#AD4038"
signal_ink = "#141810"

# References, not duplicated colour literals. Green is reserved until a module
# exposes a reliable positive state; custom Wi-Fi text is not such a state.
[semantics]
emphasis = "accent"
selected = "signal_yellow"
on_selected = "text"
success = "signal_green"
on_success = "signal_ink"
urgent = "signal_red"
on_urgent = "surface"

[typography]
# Inter approved for initial Mangobar baseline; system-wide typography remains open.
sans = "Inter"
mono = "IBM Plex Mono"
size = 13
weight = 500

[geometry]
radius = 3
spacing = 8
border = 1

[mangobar]
# Initial Mangobar baseline geometry; live bar height and buffer scale untouched.
workspace_padding = 7
workspace_gap = 1
workspace_min_width = 26
control_radius = 2
hover_radius = 0
group_gap = 6

[rofi]
# Approved initial Rofi baseline at e1f7538; future refinements require review.
width = 620
padding = 16
spacing = 10
radius = 3
search_padding = 10
row_padding = 8
row_spacing = 2
icon_size = 20
selection_edge = 3
font_size = 12
heading_size = 10
entry_size = 14

[mango]
# Approved initial MangoWM baseline from fd645da; preserve these exact values.
border_px = 2
border_radius = 6
gap_inner_horizontal = 8
gap_inner_vertical = 8
gap_outer_horizontal = 12
gap_outer_vertical = 12
root_color = "canvas"
border_color = "metal"
focus_color = "accent"
urgent_color = "signal_red"
# Functional placement indicators, not decorations or generic window success.
drop_color = "signal_green"
drop_alpha = 85
split_color = "signal_yellow"
# Neutral state overrides; these modes do not mean success/error.
maximized_screen_color = "metal"
scratchpad_color = "dark_terminal"
global_color = "accent"
overlay_color = "text_secondary"

[foot]
# First dark developer candidate: NOT approved or activated.
# Retain the installed live font and comfortable point size; Plex remains open.
font = "DejaVu Sans Mono"
font_size = 16
padding = 8
foreground = "chrome"
background = "dark_terminal"
secondary = "metal"
selection_foreground = "surface"
selection_background = "terminal_selection"
cursor_foreground = "text"
cursor_background = "signal_yellow"
regular = ["text", "terminal_red", "terminal_green", "signal_yellow", "terminal_blue", "terminal_magenta", "terminal_cyan", "canvas"]
bright = ["metal", "terminal_bright_red", "terminal_bright_green", "terminal_bright_yellow", "terminal_bright_blue", "terminal_bright_magenta", "terminal_bright_cyan", "surface"]

[foot.colors]
# Muted cool ANSI syntax roles; not new system signals.
terminal_blue = "#9DAFC8"
terminal_magenta = "#B8A2BA"
terminal_cyan = "#91B8B5"

[foot.blends]
# sRGB channel mixes: source, destination, destination proportion.
# Lift signal inks for dark-surface text; shared light-system signals unchanged.
terminal_red = ["signal_red", "chrome", 0.45]
terminal_green = ["signal_green", "chrome", 0.35]
terminal_selection = ["dark_terminal", "accent", 0.55]
terminal_bright_red = ["terminal_red", "surface", 0.20]
terminal_bright_green = ["terminal_green", "surface", 0.20]
terminal_bright_yellow = ["signal_yellow", "surface", 0.20]
terminal_bright_blue = ["terminal_blue", "surface", 0.20]
terminal_bright_magenta = ["terminal_magenta", "surface", 0.20]
terminal_bright_cyan = ["terminal_cyan", "surface", 0.20]
