name = "Rhapsody"

[colors]
# Six original foundation colours. Accent is neutral emphasis, not selection.
canvas = "#DADAE3"
surface = "#F8F8FA"
chrome = "#EAE9F0"
accent = "#77768F"
text = "#343442"
dark_terminal = "#2F303B"
# Candidate 2 additions, pending visual approval.
metal = "#A8A8B4"
text_secondary = "#666573"
text_quiet = "#686773"
signal_yellow = "#E3BE47"
signal_green = "#728858"
signal_red = "#AD4038"
signal_ink = "#141810"

# References, not duplicated colour literals. Green is reserved until a module
# exposes a reliable positive state; custom Wi-Fi text is not such a state.
[semantics]
emphasis = "accent"
selected = "signal_yellow"
on_selected = "text"
success = "signal_green"
on_success = "signal_ink"
urgent = "signal_red"
on_urgent = "surface"

[typography]
# Preview choice only; IBM Plex versus Inter remains unresolved.
sans = "Inter"
mono = "IBM Plex Mono"
size = 13
weight = 500

[geometry]
radius = 3
spacing = 8
border = 1

[mangobar]
# Candidate geometry; existing live bar height and buffer scale are untouched.
workspace_padding = 7
workspace_gap = 1
workspace_min_width = 26
control_radius = 2
hover_radius = 0
group_gap = 6
