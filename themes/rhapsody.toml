name = "Rhapsody"

[colors]
# Six original foundation colours. Accent is neutral emphasis, not selection.
canvas = "#DADAE3"
surface = "#F8F8FA"
chrome = "#EAE9F0"
accent = "#77768F"
text = "#343442"
dark_terminal = "#2F303B"
# Approved initial Mangobar baseline; not necessarily the final design.
metal = "#A8A8B4"
text_secondary = "#666573"
text_quiet = "#686773"
signal_yellow = "#E3BE47"
signal_green = "#728858"
signal_red = "#AD4038"
signal_ink = "#141810"

# References, not duplicated colour literals. Green is reserved until a module
# exposes a reliable positive state; custom Wi-Fi text is not such a state.
[semantics]
emphasis = "accent"
selected = "signal_yellow"
on_selected = "text"
success = "signal_green"
on_success = "signal_ink"
urgent = "signal_red"
on_urgent = "surface"

[typography]
# Inter approved for initial Mangobar baseline; system-wide typography remains open.
sans = "Inter"
mono = "IBM Plex Mono"
size = 13
weight = 500

[geometry]
radius = 3
spacing = 8
border = 1

[mangobar]
# Initial Mangobar baseline geometry; live bar height and buffer scale untouched.
workspace_padding = 7
workspace_gap = 1
workspace_min_width = 26
control_radius = 2
hover_radius = 0
group_gap = 6

[rofi]
# Second light-system candidate, not approved for permanent activation.
width = 620
padding = 16
spacing = 10
radius = 3
search_padding = 10
row_padding = 8
row_spacing = 2
icon_size = 20
selection_edge = 3
font_size = 12
heading_size = 10
entry_size = 14
