name = "Rhapsody"

[colors]
# Six original foundation colours. Accent is neutral emphasis, not selection.
canvas = "#DADAE3"
surface = "#F8F8FA"
chrome = "#EAE9F0"
accent = "#77768F"
text = "#343442"
dark_terminal = "#2F303B"
# Approved initial Mangobar baseline; not necessarily the final design.
metal = "#A8A8B4"
text_secondary = "#666573"
text_quiet = "#686773"
signal_yellow = "#E3BE47"
workspace_orange = "#D46A43"
signal_green = "#728858"
signal_red = "#AD4038"
signal_ink = "#141810"
# Exact white is reserved here for the explicitly approved active-workspace ink.
pure_white = "#FFFFFF"

# Distinct purposes may currently share a colour. These mappings preserve the
# approved outputs; future colour changes need separate visual review.
[semantics]
emphasis = "accent"
# Historical boxed Mangobar baseline, retained for guarded rollback.
selected = "signal_yellow"
on_selected = "text"
workspace_active = "workspace_orange"
on_workspace_active = "pure_white"
# Launcher and Command menu selection: the bar's active-workspace treatment,
# orange inset with white text (approved 2026-10-31). Thunar keeps graphite.
list_selected = "workspace_orange"
on_list_selected = "pure_white"
# Text insertion point in the picker and Thunar fields, like the terminal cursor.
text_caret = "workspace_orange"
# Separate terminal/workspace roles intentionally share the approved orange swatch.
terminal_cursor = "workspace_orange"
on_terminal_cursor = "signal_ink"
terminal_match = "signal_yellow"
on_terminal_match = "text"
success = "signal_green"
on_success = "signal_ink"
urgent = "signal_red"
on_urgent = "surface"

[typography]
# Inter is the approved system interface face (bar, Rofi, Thunar and the GTK
# interface font). ui_size is the GTK interface font size in points.
sans = "Inter"
ui_size = 10
mono = "IBM Plex Mono"
size = 13
weight = 500

[geometry]
radius = 3
spacing = 8
border = 1

[mangobar]
# Initial Mangobar baseline geometry; live bar height and buffer scale untouched.
workspace_padding = 7
workspace_gap = 1
workspace_min_width = 26
control_radius = 2
hover_radius = 0
group_gap = 6

[mangobar_candidate]
# Approved and active Quiet Workspace Strip geometry; section name retained for
# existing activation/rollback code. Its colour lives in semantics.workspace_active.
bar_height = 30
workspace_padding = 7
workspace_gap = 1
active_radius = 4
active_inset = 4
title_max_width = 240
# This specific white-on-orange active label is a user-approved contrast exception.
active_text_contrast_exception = "approved-white-on-orange"

[bar_status]
# Status readings and agent indicators, approved and activated 2026-10-30.
# Tabler line icons at the bar's text size with their values. display is
# "text" (the earlier style), "icon-value" or "icons". Gaps in logical pixels: pair (icon to
# value), item (between pairs), group (agents to system readings), edge (right
# inset, mirroring the left).
display = "icon-value"
icon_font = "tabler-icons"
pair_gap = 4
item_gap = 20
group_gap = 36
edge = 20
# Agent state colours: needs input is the workspace orange, error the urgent red.
agent_quiet = "text_secondary"
agent_name_alert = "text"
agent_input = "workspace_orange"
agent_error = "signal_red"
# Real-time signal (SIGRTMIN+n) that refreshes the agent modules at once.
refresh_signal = 8
# Left group: only workspaces with windows (and the current one) are listed, by
# number, which is also their Ctrl+number shortcut. The window title is off.
hide_empty_workspaces = true
window_title = false
# Milliseconds per clockwise turn of the working spinner, drawn by the bar
# (patches/mangobar/04-spin-custom-modules.patch) at about 15 frames a second.
spin_period = 1000
# Wi-Fi and battery glyphs are short and wide, so they are drawn larger than the
# text (patches/mangobar/05-icon-glyphs.patch); 1 keeps the text size.
wifi_icon_scale = 1.25
battery_icon_scale = 1.25

[rofi]
# Limux pickers (launcher and Command menu), approved 2026-10-30, refined 2026-10-31:
# the notification card, a flat search with an orange caret above a hairline, one
# shared left edge, orange inset selection, a quiet secondary column at a fixed
# tab stop, no icons. Font sizes in points.
width = 640
padding = 12
spacing = 8
radius = 6
# The search sits flat on the card, divided from the list by a full-width hairline.
search_padding_vertical = 14
hairline_alpha = 0.10
caret_width = 2
row_padding_vertical = 8
row_padding_horizontal = 12
row_radius = 4
font_size = 10
entry_size = 13
heading_size = 8
secondary_stop = 430
secondary_alpha = 75
lines = 7
# White on orange (~3.5:1) for selected rows extends the bar's approved exception.
selected_contrast_exception = "approved-white-on-orange"

[limux_commands]
# Command menu differences from the shared picker; behaviour stays in the script.
list_lines = 11
heading_padding_top = 12
heading_padding_bottom = 4

[mako]
# Approved 2026-10-30: porcelain card on the window grid with a label, summary
# and body hierarchy. Signal red marks critical only. No icons; the label names
# the app. Typeface is typography.sans at typography.ui_size.
surface = "surface"
text = "text"
secondary = "text_secondary"
label = "text_quiet"
edge = "metal"
urgent = "signal_red"
progress = "canvas"
border = 1
radius = 6
padding_vertical = 12
padding_horizontal = 16
width = 360
margin = 12
label_tracking = 600

[mango]
# Approved initial MangoWM baseline from fd645da; preserve these exact values.
border_px = 2
border_radius = 6
gap_inner_horizontal = 8
gap_inner_vertical = 8
gap_outer_horizontal = 12
gap_outer_vertical = 12
root_color = "canvas"
border_color = "metal"
focus_color = "accent"
urgent_color = "signal_red"
# Functional placement indicators, not decorations or generic window success.
drop_color = "signal_green"
drop_alpha = 85
split_color = "signal_yellow"
# Neutral state overrides; these modes do not mean success/error.
maximized_screen_color = "metal"
scratchpad_color = "dark_terminal"
global_color = "accent"
overlay_color = "text_secondary"

[lock]
# Limux lock screen (hyprlock), approved target 2026-10-31: the desktop canvas,
# a light clock, the date and one porcelain field with an orange edge (you are
# always typing there). Sizes in logical pixels at the display's own scale.
ground = "canvas"
time = "text"
# On the canvas ground only graphite reaches 4.5:1 (secondary grey is 4.12), so
# the date and small labels use graphite and are set apart by size and weight.
date = "text"
labels = "text"
placeholder = "text_quiet"
field = "surface"
field_edge = "workspace_orange"
checking = "metal"
fail = "signal_red"
dots = "text"
time_size = 96
time_weight = 300
date_size = 17
note_size = 13
field_width = 280
field_height = 40
field_edge_width = 2
field_radius = 4
dot_size = 8
dot_gap = 9
# Vertical rhythm: the stack's centre sits this far above the display centre
# (40% from the top on the 1200px-tall display).
stack_raise = 120
date_gap = 14
field_gap = 56
note_gap = 12
user_inset = 40

[thunar]
# Limux Files on Thunar 4.20 over the adw-gtk3 GTK 3 theme. Approved design
# target 2026-10-30: one porcelain surface, type-led path, quiet labels,
# graphite selection (metal when inactive), outline icons. The GTK interface
# font is typography.sans at typography.ui_size.
gtk_theme = "adw-gtk3"
icon_theme = "Limux-Rhapsody"
surface = "surface"
hover = "chrome"
location = "chrome"
# Text fields are flat: porcelain with a metal edge, orange edge and caret while typing.
field = "surface"
field_edge = "metal"
field_focus = "workspace_orange"
caret = "workspace_orange"
selected = "text"
on_selected = "surface"
selected_inactive = "metal"
on_selected_inactive = "text"
text = "text"
secondary = "text_secondary"
quiet = "text_quiet"
disabled = "metal"
controls = "text"
on_controls = "surface"
focus = "accent"
destructive = "signal_red"
hairline_alpha = 0.10
icon_folder = "chrome"
icon_document = "surface"
icon_stroke = "text_quiet"

[foot]
# Current approved Foot palette includes the orange block cursor; live activation
# is guarded by scripts/activate-foot.py. Plex remains an open font comparison.
font = "Adwaita Mono"
font_size = 12.5
padding = 16
foreground = "chrome"
background = "dark_terminal"
secondary = "metal"
selection_foreground = "surface"
selection_background = "terminal_selection"
cursor_foreground = "on_terminal_cursor"
cursor_background = "terminal_cursor"
regular = ["text", "terminal_red", "terminal_green", "signal_yellow", "terminal_blue", "terminal_magenta", "terminal_cyan", "canvas"]
bright = ["metal", "terminal_bright_red", "terminal_bright_green", "terminal_bright_yellow", "terminal_bright_blue", "terminal_bright_magenta", "terminal_bright_cyan", "surface"]

[foot.colors]
# Muted cool ANSI syntax roles; not new system signals.
terminal_blue = "#9DAFC8"
terminal_magenta = "#B8A2BA"
terminal_cyan = "#91B8B5"

[foot.blends]
# sRGB channel mixes: source, destination, destination proportion.
# Lift signal inks for dark-surface text; shared light-system signals unchanged.
terminal_red = ["signal_red", "chrome", 0.45]
terminal_green = ["signal_green", "chrome", 0.35]
terminal_selection = ["dark_terminal", "accent", 0.55]
terminal_bright_red = ["terminal_red", "surface", 0.20]
terminal_bright_green = ["terminal_green", "surface", 0.20]
terminal_bright_yellow = ["signal_yellow", "surface", 0.20]
terminal_bright_blue = ["terminal_blue", "surface", 0.20]
terminal_bright_magenta = ["terminal_magenta", "surface", 0.20]
terminal_bright_cyan = ["terminal_cyan", "surface", 0.20]
