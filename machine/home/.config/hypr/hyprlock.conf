# Limux lock screen behaviour. Hand-maintained; the appearance is generated into
# limux-lock.conf from themes/rhapsody.toml ([lock]) by scripts/activate-lock.py.
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

source = ~/.config/hypr/limux-lock.conf
