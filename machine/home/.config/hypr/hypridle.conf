# Limux idle behaviour, approved 2026-10-31. Hand-maintained.
# Dims at 4m30s, locks at 5m, display off at 5m30s; suspends after 15m on battery
# only. Always locks before sleep, so opening the lid shows the lock screen.
# Apps that ask to stay awake (Firefox playing video) pause these steps.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = mmsg dispatch enable_monitor,eDP-1
}

listener {
    timeout = 270
    on-timeout = limux-idle dim
    on-resume = limux-idle undim
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = mmsg dispatch disable_monitor,eDP-1
    on-resume = mmsg dispatch enable_monitor,eDP-1
}

listener {
    timeout = 900
    on-timeout = limux-idle suspend-on-battery
}
